name: Build OpenWrt for Netcraze NC-1812

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: openwrt-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget curl xz-utils device-tree-compiler

      - name: Clone OpenWrt
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git --depth=1
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcraze_nc-1812=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_LUCI=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_BTRFS_PROGS_ZSTD=y
          CONFIG_ZSTD_OPTIMIZE_O3=y
          CONFIG_OPENSSL_WITH_CHACHA20=y
          CONFIG_OPENSSL_WITH_POLY1305=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp openwrt/bin/targets/mediatek/filogic/openwrt-*-netcraze_nc-1812-* artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/*.manifest artifacts/ 2>/dev/null || true
          cp openwrt/build.log artifacts/ 2>/dev/null || true
          echo "=== Build output ==="
          find openwrt/bin/targets/mediatek/filogic/ -type f 2>/dev/null | head -30

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-netcraze-nc1812
          path: artifacts/
          retention-days: 30
