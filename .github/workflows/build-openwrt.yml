name: Build OpenWrt for Netcraze NC-1812

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: openwrt-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl xz-utils device-tree-compiler
          # python3-distutils removed in Ubuntu 24.04 (Python 3.12)

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        timeout-minutes: 10

      - name: Apply FM25G02B Quad I/O read dummy fix (PR #24007)
        run: |
          cd openwrt
          # Find the correct kernel pending directory
          KERNEL_DIR=$(ls -d target/linux/generic/pending-* 2>/dev/null | head -1)
          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: No target/linux/generic/pending-* directory found!"
            exit 1
          fi
          echo "Using kernel directory: $KERNEL_DIR"
          PATCH_FILE="$KERNEL_DIR/403-mtd-spinand-fmsh-fix-FM25G01B-FM25G02B-quad-io-read-dummy.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            cat > "$PATCH_FILE" << 'PATCH'
--- a/drivers/mtd/nand/spi/fmsh.c
+++ b/drivers/mtd/nand/spi/fmsh.c
@@ -44,6 +44,14 @@ static SPINAND_OP_VARIANTS(update_cache_
 		SPINAND_PROG_LOAD_1S_1S_4S_OP(false, 0, NULL, 0),
 		SPINAND_PROG_LOAD_1S_1S_1S_OP(false, 0, NULL, 0));
 
+static SPINAND_OP_VARIANTS(fm25g_read_cache_variants,
+		SPINAND_PAGE_READ_FROM_CACHE_1S_4S_4S_OP(0, 1, NULL, 0, 0),
+		SPINAND_PAGE_READ_FROM_CACHE_1S_1S_4S_OP(0, 1, NULL, 0, 0),
+		SPINAND_PAGE_READ_FROM_CACHE_1S_2S_2S_OP(0, 1, NULL, 0, 0),
+		SPINAND_PAGE_READ_FROM_CACHE_1S_1S_2S_OP(0, 1, NULL, 0, 0),
+		SPINAND_PAGE_READ_FROM_CACHE_FAST_1S_1S_1S_OP(0, 1, NULL, 0, 0),
+		SPINAND_PAGE_READ_FROM_CACHE_1S_1S_1S_OP(0, 1, NULL, 0, 0));
+
 static int fm25g01b_ooblayout_ecc(struct mtd_info *mtd, int section,
 				  struct mtd_oob_region *region)
 {
@@ -192,7 +200,7 @@ static const struct spinand_info fmsh_sp
 		     SPINAND_ID(SPINAND_READID_METHOD_OPCODE_DUMMY, 0xd1),
 		     NAND_MEMORG(1, 2048, 128, 64, 1024, 21, 1, 1, 1),
 		     NAND_ECCREQ(8, 528),
-		     SPINAND_INFO_OP_VARIANTS(&read_cache_variants,
+		     SPINAND_INFO_OP_VARIANTS(&fm25g_read_cache_variants,
 					      &write_cache_variants,
 					      &update_cache_variants),
 		     SPINAND_HAS_QE_BIT,
@@ -202,7 +210,7 @@ static const struct spinand_info fmsh_sp
 		     SPINAND_ID(SPINAND_READID_METHOD_OPCODE_DUMMY, 0xd2),
 		     NAND_MEMORG(1, 2048, 128, 64, 2048, 41, 1, 1, 1),
 		     NAND_ECCREQ(8, 528),
-		     SPINAND_INFO_OP_VARIANTS(&read_cache_variants,
+		     SPINAND_INFO_OP_VARIANTS(&fm25g_read_cache_variants,
 					      &write_cache_variants,
 					      &update_cache_variants),
 		     SPINAND_HAS_QE_BIT,
PATCH
            echo "Patch applied to $PATCH_FILE"
          else
            echo "Patch already exists"
          fi

      - name: Configure
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcraze_nc-1812=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_LUCI=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_BTRFS_PROGS_ZSTD=y
          CONFIG_ZSTD_OPTIMIZE_O3=y
          CONFIG_OPENSSL_WITH_CHACHA20=y
          CONFIG_OPENSSL_WITH_POLY1305=y
          CONFIG_PACKAGE_mtd-utils=y
          CONFIG_PACKAGE_kmod-mtd-rw=n
          CONFIG_PACKAGE_nand-utils=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
        timeout-minutes: 30

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log
        timeout-minutes: 240

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets/mediatek/filogic/ -type f 2>/dev/null | head -30 | tee artifacts/filelist.txt
          cp openwrt/bin/targets/mediatek/filogic/openwrt-*-netcraze_nc-1812-* artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/*.manifest artifacts/ 2>/dev/null || true
          cp openwrt/build.log artifacts/ 2>/dev/null || true
          # Save config for debugging
          cp openwrt/.config artifacts/ 2>/dev/null || true
          # Collect nandwrite and flash_erase from staging
          find openwrt/build_dir/target-*/ -name "nandwrite" -type f 2>/dev/null | head -5
          find openwrt/build_dir/target-*/ -name "flash_erase" -type f 2>/dev/null | head -5
          find openwrt/staging_dir/toolchain-*/ -name "nandwrite" -o -name "flash_erase" 2>/dev/null | head -5
          # Find mtd-utils binaries in ipkg or staging
          find openwrt -path "*/mtd-utils*" -name "nandwrite" -type f 2>/dev/null | head -5
          find openwrt -path "*/mtd-utils*" -name "flash_erase" -type f 2>/dev/null | head -5
          # Copy if found
          cp $(find openwrt -path "*/mtd-utils*" -name "nandwrite" -type f 2>/dev/null | head -1) artifacts/ 2>/dev/null || echo "nandwrite not found"
          cp $(find openwrt -path "*/mtd-utils*" -name "flash_erase" -type f 2>/dev/null | head -1) artifacts/ 2>/dev/null || echo "flash_erase not found"
          echo "=== Artifacts ==="
          ls -la artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-netcraze-nc1812
          path: artifacts/
          retention-days: 30
