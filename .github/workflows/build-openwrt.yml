name: Build OpenWrt for Netcraze NC-1812

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: openwrt-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl xz-utils device-tree-compiler
          # python3-distutils removed in Ubuntu 24.04 (Python 3.12)

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        timeout-minutes: 10

      - name: Apply FM25G02B Quad I/O read dummy fix (PR #24007)
        run: |
          set -x
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "=== Current dir: $(pwd) ==="
          echo "=== Contents of target/linux/generic/ ==="
          ls -la target/linux/generic/ 2>/dev/null || echo "Directory not found"
          echo "=== Looking for pending directories ==="
          find target/linux/generic -maxdepth 1 -type d -name 'pending-*' 2>/dev/null
          KERNEL_DIR=$(find target/linux/generic -maxdepth 1 -type d -name 'pending-*' 2>/dev/null | head -1)
          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: No target/linux/generic/pending-* directory found!"
            exit 1
          fi
          echo "Using kernel directory: $KERNEL_DIR"
          SRC="$GITHUB_WORKSPACE/patches/403-mtd-spinand-fmsh-fix-FM25G01B-FM25G02B-quad-io-read-dummy.patch"
          echo "Source: $SRC"
          ls -la "$SRC" || { echo "Patch file not found!"; exit 1; }
          cp -v "$SRC" "$KERNEL_DIR/"
          ls -la "$KERNEL_DIR/403-mtd-spinand-fmsh-fix-FM25G01B-FM25G02B-quad-io-read-dummy.patch"
          echo "=== Patch applied successfully ==="

      - name: Configure
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcraze_nc-1812=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_LUCI=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_BTRFS_PROGS_ZSTD=y
          CONFIG_ZSTD_OPTIMIZE_O3=y
          CONFIG_OPENSSL_WITH_CHACHA20=y
          CONFIG_OPENSSL_WITH_POLY1305=y
          CONFIG_PACKAGE_mtd-utils=y
          CONFIG_PACKAGE_kmod-mtd-rw=n
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_kmod-ipt-nfqueue=y
          CONFIG_PACKAGE_kmod-nfnetlink-queue=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-ipt-core=y
          CONFIG_PACKAGE_kmod-ip6tables=y
          CONFIG_PACKAGE_kmod-ipt-conntrack-extra=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          CONFIG_PACKAGE_kmod-ipt-filter=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-ip6tables-extra=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)
        timeout-minutes: 30

      - name: Build kernel modules only
        run: |
          cd openwrt
          make -j$(nproc) tools/install toolchain/install V=s 2>&1 | tee build.log
          make -j$(nproc) target/linux/compile V=s 2>&1 | tee -a build.log
        timeout-minutes: 90

      - name: Collect kernel modules
        if: always()
        run: |
          mkdir -p artifacts/kmods
          # Find compiled .ko files
          find openwrt/build_dir/target-*/linux-mediatek_filogic/linux-*/ -name '*.ko' -type f 2>/dev/null | head -50 | tee artifacts/kmods/modules-list.txt
          # Find kmod .ipk packages
          find openwrt/bin/packages -name 'kmod-*.ipk' -type f 2>/dev/null | head -30 | tee -a artifacts/kmods/modules-list.txt
          find openwrt/bin/targets -name 'kmod-*.ipk' -type f 2>/dev/null | head -30 | tee -a artifacts/kmods/modules-list.txt
          # Copy .ko files
          for f in $(find openwrt/build_dir/target-*/linux-mediatek_filogic/linux-*/ -name '*.ko' -type f 2>/dev/null); do
            cp "$f" artifacts/kmods/ 2>/dev/null || true
          done
          # Copy .ipk packages
          find openwrt/bin -name 'kmod-*.ipk' -type f -exec cp {} artifacts/kmods/ \; 2>/dev/null || true
          # Also copy the kernel .config for reference
          cp openwrt/.config artifacts/kmods/kernel.config 2>/dev/null || true
          # Copy build log
          cp openwrt/build.log artifacts/ 2>/dev/null || true
          echo "=== Artifacts ==="
          ls -laR artifacts/

      - name: Upload kernel modules
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nc1812-kmods
          path: artifacts/
          retention-days: 30
